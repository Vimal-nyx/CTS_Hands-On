<div style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
  <div class="hero glass-card" style="padding: 3rem 2rem; margin-bottom: 2rem; text-align: center;">
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      {{ portalName }}
    </h1>
    <p style="color: #94a3b8; margin-bottom: 1.5rem; font-size: 1.1rem;">
      Your dynamic Student Course Portal
    </p>
    
    <div style="display: flex; gap: 1rem; justify-content: center; align-items: center;">
      <button [disabled]="!isPortalActive" (click)="onEnrollClick()">
        Enroll Now
      </button>
    </div>

    <p *ngIf="message" style="margin-top: 1rem; color: #10b981; font-weight: 600; font-size: 1.1rem;">
      {{ message }}
    </p>
  </div>

  <div class="glass-card" style="padding: 2rem;">
    <h3 style="margin-bottom: 0.5rem; font-size: 1.25rem;">Live Search Demo</h3>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem;">
      Demonstrating two-way data binding with ngModel.
    </p>

    <input [(ngModel)]="searchTerm" placeholder="Type to search..." style="margin-bottom: 1rem; max-width: 400px;">
    
    <p style="color: #f8fafc;">Searching for: <strong style="color: #3b82f6;">{{ searchTerm }}</strong></p>
  </div>
</div>
